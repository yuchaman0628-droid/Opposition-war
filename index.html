<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opposition-war</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05050a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
        }

        /* 被弾時の赤フラッシュ効果 */
        #damage-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0.3);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s ease-out;
            z-index: 20;
        }

        /* UI オーバーレイ */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            background: rgba(5, 5, 12, 0.85);
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        h1 {
            font-size: 4.5rem;
            margin-bottom: 10px;
            letter-spacing: 6px;
            color: #00f0ff;
            text-shadow: 0 0 15px #00f0ff, 0 0 30px #ff0055;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #a0a5c0;
        }

        .selection-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .select-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #333;
            border-radius: 10px;
            padding: 20px 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 200px;
        }

        .select-card:hover, .select-card.active {
            border-color: #00f0ff;
            background: rgba(0, 240, 255, 0.15);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            transform: translateY(-5px);
        }

        .select-card h3 {
            margin: 0 0 10px 0;
            font-size: 1.5rem;
            color: #fff;
        }

        .select-card p {
            font-size: 0.9rem;
            margin: 0;
            color: #aaa;
        }

        .btn {
            padding: 15px 50px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #ff0055, #ff5500);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
            transition: 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(255, 0, 85, 0.9);
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 1.2rem;
            z-index: 5;
            display: none;
            background: rgba(10, 10, 20, 0.7);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            text-shadow: 0 0 5px #000;
        }

        .hp-bar-bg {
            width: 200px;
            height: 12px;
            background: #222;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 4px;
            margin-bottom: 12px;
            border: 1px solid #444;
        }

        .hp-bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.2s ease;
        }

        #player-hp-fill { background: linear-gradient(90deg, #00ff88, #00f0ff); }
        #enemy-hp-fill { background: linear-gradient(90deg, #ff0055, #ff5500); }

        #controls-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #00f0ff;
            font-size: 0.9rem;
            z-index: 5;
            display: none;
            background: rgba(10, 10, 20, 0.7);
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid rgba(0, 240, 255, 0.3);
        }
    </style>
    <!-- Three.js & OrbitControls 読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="game-container"></div>
    <div id="damage-flash"></div>

    <!-- HUD -->
    <div id="hud">
        <div>PLAYER HP (<span id="player-type-label">BIKE</span>)</div>
        <div class="hp-bar-bg"><div id="player-hp-fill" class="hp-bar-fill"></div></div>
        
        <div>ENEMY HP (<span id="enemy-type-label">TANK</span>)</div>
        <div class="hp-bar-bg"><div id="enemy-hp-fill" class="hp-bar-fill"></div></div>
    </div>

    <div id="controls-info">
        [W/S] 前進/後退 | [A/D] 旋回 | [SPACE] 攻撃 | [ドラッグ] 視点操作 | [ホイール] ズーム
    </div>

    <!-- タイトル画面 -->
    <div id="title-screen" class="overlay">
        <h1>Opposition-war</h1>
        <p>乗るマシンを選んで出撃せよ！</p>
        
        <div class="selection-container">
            <div id="select-bike" class="select-card active" onclick="selectVehicle('bike')">
                <h3>BIKE</h3>
                <p>機動力重視<br>連射攻撃 / 高速移動</p>
            </div>
            <div id="select-tank" class="select-card" onclick="selectVehicle('tank')">
                <h3>TANK</h3>
                <p>火力・装甲重視<br>強力な砲撃 / 重装甲</p>
            </div>
        </div>

        <button class="btn" onclick="startGame()">GAME START</button>
    </div>

    <!-- ゲームオーバー画面 -->
    <div id="gameover-screen" class="overlay" style="display: none;">
        <h1 id="gameover-title">GAME OVER</h1>
        <p id="gameover-msg">あなたのマシンは撃破されました...</p>
        <button class="btn" onclick="restartGame()">RETRY</button>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let player, enemy;
        let playerType = 'bike'; // 'bike' or 'tank'
        let bullets = [], enemyBullets = [];
        let keys = {};
        let isGameRunning = false;

        let playerStats = { hp: 100, maxHp: 100, speed: 0, maxSpeed: 0.7, accel: 0.025, rotSpeed: 0.04, cooldown: 180 };
        let enemyStats = { hp: 200, maxHp: 200, lastShoot: 0, speed: 0.1 };

        function selectVehicle(type) {
            playerType = type;
            document.getElementById('select-bike').classList.toggle('active', type === 'bike');
            document.getElementById('select-tank').classList.toggle('active', type === 'tank');
        }

        function init() {
            // シーン設定
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.FogExp2(0x050510, 0.012);

            // カメラ設定
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            // レンダラー設定
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('game-container').appendChild(renderer.domElement);

            // カメラ操作 (OrbitControls)
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // 地下に潜らないように制御
            controls.minDistance = 5;
            controls.maxDistance = 40;

            // ライティング (サイバーネオン調)
            const ambientLight = new THREE.AmbientLight(0x223344, 1.2);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x00ffff, 0.8);
            dirLight.position.set(30, 50, 30);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const dirLight2 = new THREE.DirectionalLight(0xff0055, 0.5);
            dirLight2.position.set(-30, 50, -30);
            scene.add(dirLight2);

            // フィールド（グリッドデザイン）
            createCyberField();

            // イベントリスナー
            window.addEventListener('keydown', e => keys[e.code] = true);
            window.addEventListener('keyup', e => keys[e.code] = false);
            window.addEventListener('resize', onWindowResize);

            // アニメーションループ開始
            animate();
        }

        // SFサイバーフィールド＆障害物の生成
        function createCyberField() {
            const floorGeo = new THREE.PlaneGeometry(250, 250);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x0a0a15, roughness: 0.5, metalness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // ネオングリッド
            const grid = new THREE.GridHelper(250, 50, 0x00f0ff, 0x112244);
            grid.position.y = 0.02;
            scene.add(grid);

            // 障害物（光るタワー）の配置
            const obstacleGeo = new THREE.BoxGeometry(4, 12, 4);
            const obstacleMat = new THREE.MeshStandardMaterial({ color: 0x111525, roughness: 0.3, metalness: 0.9 });
            const edgeMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });

            for (let i = 0; i < 16; i++) {
                const obstacle = new THREE.Mesh(obstacleGeo, obstacleMat);
                const x = (Math.random() - 0.5) * 160;
                const z = (Math.random() - 0.5) * 160;
                
                // 中央付近には置かない
                if (Math.abs(x) < 20 && Math.abs(z) < 20) continue;

                obstacle.position.set(x, 6, z);
                obstacle.castShadow = true;
                obstacle.receiveShadow = true;
                scene.add(obstacle);

                // タワーの縁を光らせる
                const edges = new THREE.LineSegments(new THREE.EdgesGeometry(obstacleGeo), edgeMat);
                obstacle.add(edges);
            }
        }

        // バイクモデル生成
        function buildBikeModel(color) {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, metalness: 0.7, roughness: 0.2 });
            const neonMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });

            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 2.2), bodyMat);
            body.position.y = 0.6;
            body.castShadow = true;
            group.add(body);

            // タイヤ
            const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.3, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
            
            const frontWheel = new THREE.Mesh(wheelGeo, wheelMat);
            frontWheel.rotation.z = Math.PI / 2;
            frontWheel.position.set(0, 0.45, 1.0);
            group.add(frontWheel);

            const backWheel = frontWheel.clone();
            backWheel.position.set(0, 0.45, -1.0);
            group.add(backWheel);

            // ネオンライン
            const line = new THREE.Mesh(new THREE.BoxGeometry(0.82, 0.1, 2.0), neonMat);
            line.position.y = 0.7;
            group.add(line);

            return group;
        }

        // 戦車モデル生成
        function buildTankModel(color) {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, metalness: 0.5, roughness: 0.5 });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x111111 });

            // 本体
            const body = new THREE.Mesh(new THREE.BoxGeometry(3.5, 1.2, 4.5), bodyMat);
            body.position.y = 0.8;
            body.castShadow = true;
            group.add(body);

            // クローラー（キャタピラ）
            const trackGeo = new THREE.BoxGeometry(0.8, 1.0, 4.7);
            const leftTrack = new THREE.Mesh(trackGeo, darkMat);
            leftTrack.position.set(1.9, 0.6, 0);
            group.add(leftTrack);

            const rightTrack = leftTrack.clone();
            rightTrack.position.set(-1.9, 0.6, 0);
            group.add(rightTrack);

            // 砲塔
            const turret = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.9, 2.4), bodyMat);
            turret.position.set(0, 1.8, 0);
            group.add(turret);

            // 主砲
            const cannon = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 3.2), darkMat);
            cannon.rotation.x = Math.PI / 2;
            cannon.position.set(0, 1.8, 1.8);
            group.add(cannon);

            return group;
        }

        function setupEntities() {
            if (player) scene.remove(player);
            if (enemy) scene.remove(enemy);

            if (playerType === 'bike') {
                player = buildBikeModel(0x00f0ff);
                enemy = buildTankModel(0xff0055);
                
                playerStats = { hp: 100, maxHp: 100, speed: 0, maxSpeed: 0.75, accel: 0.03, rotSpeed: 0.045, cooldown: 150 };
                enemyStats = { hp: 220, maxHp: 220, lastShoot: 0, speed: 0.08 };

                document.getElementById('player-type-label').innerText = 'BIKE';
                document.getElementById('enemy-type-label').innerText = 'TANK';
            } else {
                player = buildTankModel(0x00ff88);
                enemy = buildBikeModel(0xff0055);

                playerStats = { hp: 200, maxHp: 200, speed: 0, maxSpeed: 0.4, accel: 0.015, rotSpeed: 0.025, cooldown: 400 };
                enemyStats = { hp: 100, maxHp: 100, lastShoot: 0, speed: 0.5 };

                document.getElementById('player-type-label').innerText = 'TANK';
                document.getElementById('enemy-type-label').innerText = 'BIKE';
            }

            player.position.set(0, 0, 40);
            enemy.position.set(0, 0, -40);

            scene.add(player);
            scene.add(enemy);
        }

        function startGame() {
            document.getElementById('title-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('controls-info').style.display = 'block';
            
            setupEntities();
            resetGame();
            isGameRunning = true;
        }

        function restartGame() {
            document.getElementById('gameover-screen').style.display = 'none';
            setupEntities();
            resetGame();
            isGameRunning = true;
        }

        function resetGame() {
            player.position.set(0, 0, 40);
            player.rotation.set(0, 0, 0);
            enemy.position.set(0, 0, -40);
            enemy.rotation.set(0, 0, 0);

            bullets.forEach(b => scene.remove(b.mesh));
            enemyBullets.forEach(b => scene.remove(b.mesh));
            bullets = [];
            enemyBullets = [];

            // カメラ位置初期化
            camera.position.set(0, 8, 55);
            controls.target.copy(player.position);

            updateHUD();
        }

        function updateHUD() {
            const pPct = Math.max(0, (playerStats.hp / playerStats.maxHp) * 100);
            const ePct = Math.max(0, (enemyStats.hp / enemyStats.maxHp) * 100);
            
            document.getElementById('player-hp-fill').style.width = pPct + '%';
            document.getElementById('enemy-hp-fill').style.width = ePct + '%';
        }

        function triggerDamageFlash() {
            const flash = document.getElementById('damage-flash');
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; }, 120);
        }

        // プレイヤー攻撃処理
        function shootPlayerBullet() {
            const isTank = playerType === 'tank';
            const radius = isTank ? 0.4 : 0.2;
            const geo = new THREE.SphereGeometry(radius, 8, 8);
            const mat = new THREE.MeshBasicMaterial({ color: isTank ? 0x00ff88 : 0x00ffff });
            const mesh = new THREE.Mesh(geo, mat);

            // 弾の発射位置
            mesh.position.copy(player.position);
            mesh.position.y += isTank ? 1.8 : 0.6;

            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion);
            bullets.push({ mesh: mesh, dir: dir, life: 120, damage: isTank ? 35 : 12, speed: isTank ? 1.5 : 1.3 });
            scene.add(mesh);
        }

        // 敵攻撃処理
        function shootEnemyBullet() {
            const isEnemyTank = playerType === 'bike';
            const radius = isEnemyTank ? 0.5 : 0.25;
            const geo = new THREE.SphereGeometry(radius, 8, 8);
            const mat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
            const mesh = new THREE.Mesh(geo, mat);

            mesh.position.copy(enemy.position);
            mesh.position.y += isEnemyTank ? 1.8 : 0.6;

            // プレイヤー方向へ狙撃
            const targetPos = player.position.clone();
            targetPos.y += 0.8; // 狙いをプレイヤーの胴体に合わせる
            const dir = new THREE.Vector3().subVectors(targetPos, mesh.position).normalize();

            enemyBullets.push({ 
                mesh: mesh, 
                dir: dir, 
                life: 140, 
                damage: isEnemyTank ? 25 : 10, 
                speed: isEnemyTank ? 1.1 : 1.2 
            });
            scene.add(mesh);
        }

        function updatePlayer() {
            // 移動キー入力
            if (keys['KeyW']) playerStats.speed = Math.min(playerStats.speed + playerStats.accel, playerStats.maxSpeed);
            else if (keys['KeyS']) playerStats.speed = Math.max(playerStats.speed - playerStats.accel, -playerStats.maxSpeed / 2);
            else playerStats.speed *= 0.94; // 自然減速

            if (keys['KeyA']) player.rotation.y += playerStats.rotSpeed;
            if (keys['KeyD']) player.rotation.y -= playerStats.rotSpeed;

            player.translateZ(-playerStats.speed);

            // エリア制限
            player.position.x = Math.max(-110, Math.min(110, player.position.x));
            player.position.z = Math.max(-110, Math.min(110, player.position.z));

            // 攻撃
            if (keys['Space']) {
                if (!player.lastShoot || Date.now() - player.lastShoot > playerStats.cooldown) {
                    shootPlayerBullet();
                    player.lastShoot = Date.now();
                }
            }

            // カメラターゲットをプレイヤーに追従
            const camOffset = camera.position.clone().sub(controls.target);
            controls.target.copy(player.position);
            camera.position.copy(player.position).add(camOffset);
            controls.update();
        }

        function updateEnemy() {
            // 敵AIの行動
            enemy.lookAt(player.position.x, enemy.position.y, player.position.z);

            const dist = enemy.position.distanceTo(player.position);

            if (playerType === 'bike') {
                // 敵が戦車の場合：適度な距離を維持しながらじわじわ接近
                if (dist > 18) enemy.translateZ(enemyStats.speed);
                
                if (Date.now() - enemyStats.lastShoot > 1600) {
                    shootEnemyBullet();
                    enemyStats.lastShoot = Date.now();
                }
            } else {
                // 敵がバイクの場合：高速で円を描くように周回
                enemy.translateZ(enemyStats.speed);
                enemy.rotation.y += 0.02;

                if (Date.now() - enemyStats.lastShoot > 400) {
                    shootEnemyBullet();
                    enemyStats.lastShoot = Date.now();
                }
            }
        }

        function updateBullets() {
            // プレイヤーの弾更新
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.mesh.position.addScaledVector(b.dir, b.speed);
                b.life--;

                // 当たり判定 (敵)
                const hitDist = playerType === 'tank' ? 2.0 : 2.8; // 敵のサイズに合わせて判定調整
                if (b.mesh.position.distanceTo(enemy.position) < hitDist) {
                    enemyStats.hp -= b.damage;
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                    updateHUD();
                    checkWinLoss();
                    continue;
                }

                if (b.life <= 0) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }

            // 敵の弾更新（戦車の攻撃判定も修正済み）
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                let b = enemyBullets[i];
                b.mesh.position.addScaledVector(b.dir, b.speed);
                b.life--;

                // 当たり判定 (プレイヤー) - Y軸も含めた距離で判定
                const playerHitDist = playerType === 'tank' ? 2.8 : 1.8;
                
                if (b.mesh.position.distanceTo(player.position) < playerHitDist) {
                    playerStats.hp -= b.damage;
                    triggerDamageFlash(); // 被弾エフェクト
                    scene.remove(b.mesh);
                    enemyBullets.splice(i, 1);
                    updateHUD();
                    checkWinLoss();
                    continue;
                }

                if (b.life <= 0) {
                    scene.remove(b.mesh);
                    enemyBullets.splice(i, 1);
                }
            }
        }

        function checkWinLoss() {
            if (enemyStats.hp <= 0) {
                endGame("VICTORY!", "敵マシンを撃破しました！ミッション完了！");
            } else if (playerStats.hp <= 0) {
                endGame("GAME OVER", "あなたのマシンは破壊されました...");
            }
        }

        function endGame(title, msg) {
            isGameRunning = false;
            document.getElementById('gameover-title').innerText = title;
            document.getElementById('gameover-msg').innerText = msg;
            document.getElementById('gameover-screen').style.display = 'flex';
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isGameRunning) {
                updatePlayer();
                updateEnemy();
                updateBullets();
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
