<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Opposition-war Online</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body {
            margin: 0; overflow: hidden; background-color: #030308;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none; color: #fff;
        }

        #game-container { width: 100vw; height: 100vh; }

        /* フラッシュエフェクト */
        #flash-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; opacity: 0; transition: opacity 0.1s ease-out; z-index: 20;
        }

        /* オーバーレイUI */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(5, 5, 12, 0.9); backdrop-filter: blur(8px); z-index: 10;
            padding: 20px; text-align: center;
        }

        h1 {
            font-size: 3.2rem; margin: 0 0 10px 0; letter-spacing: 4px;
            color: #00f0ff; text-shadow: 0 0 20px #00f0ff, 0 0 40px #ff0055;
        }

        p { font-size: 1rem; margin-bottom: 20px; color: #a0a5c0; }

        .config-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px;
            max-width: 850px; width: 100%; margin-bottom: 20px; max-height: 60vh; overflow-y: auto;
        }

        .config-box {
            background: rgba(255, 255, 255, 0.05); border: 1px solid #333;
            border-radius: 8px; padding: 15px; text-align: left;
        }

        .config-box h4 { margin: 0 0 10px 0; color: #00f0ff; border-bottom: 1px solid rgba(0, 240, 255, 0.2); padding-bottom: 5px; }

        label { display: block; font-size: 0.85rem; color: #ccc; margin-top: 8px; }

        select, input[type="text"], input[type="range"] {
            width: 100%; padding: 8px; background: #111525; border: 1px solid #00f0ff;
            color: #fff; border-radius: 4px; margin-top: 4px; font-size: 0.9rem;
        }

        .btn {
            padding: 12px 35px; font-size: 1.2rem; font-weight: bold; color: #fff;
            background: linear-gradient(45deg, #ff0055, #ff5500); border: none;
            border-radius: 30px; cursor: pointer; box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
            transition: 0.2s; margin: 5px; display: inline-block;
        }

        .btn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(255, 0, 85, 0.9); }
        .btn-secondary { background: linear-gradient(45deg, #0088ff, #00f0ff); box-shadow: 0 0 15px rgba(0, 240, 255, 0.5); }

        /* HUD */
        #hud {
            position: absolute; top: 15px; left: 15px; z-index: 5; display: none;
            background: rgba(10, 10, 20, 0.8); padding: 12px 18px; border-radius: 8px;
            border: 1px solid rgba(0, 240, 255, 0.3); text-shadow: 0 0 5px #000;
        }

        .hp-bar-bg { width: 180px; height: 10px; background: #222; border-radius: 5px; overflow: hidden; margin: 4px 0 8px 0; }
        .hp-bar-fill { height: 100%; width: 100%; transition: width 0.15s ease; }
        #player-hp-fill { background: linear-gradient(90deg, #00ff88, #00f0ff); }
        #enemy-hp-fill { background: linear-gradient(90deg, #ff0055, #ff5500); }

        #pause-btn-hud {
            position: absolute; top: 15px; right: 15px; z-index: 5; display: none;
            padding: 8px 16px; font-size: 0.9rem;
        }

        /* スマホ操作バーチャルボタン */
        #touch-controls {
            position: absolute; bottom: 15px; left: 0; width: 100%;
            display: none; justify-content: space-between; padding: 0 20px;
            z-index: 6; pointer-events: none;
        }

        .touch-group { display: flex; gap: 10px; pointer-events: auto; }

        .t-btn {
            width: 60px; height: 60px; border-radius: 50%;
            background: rgba(0, 240, 255, 0.25); border: 2px solid #00f0ff;
            color: #fff; font-size: 1.4rem; font-weight: bold;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4); active { background: rgba(0, 240, 255, 0.6); }
        }

        .t-btn-fire {
            width: 70px; height: 70px; background: rgba(255, 0, 85, 0.3); border-color: #ff0055;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
        }

        /* オンライン接続エリア */
        .online-panel {
            background: rgba(0, 240, 255, 0.1); border: 1px solid #00f0ff;
            border-radius: 8px; padding: 10px; margin-top: 10px;
        }
    </style>
    <!-- Three.js / OrbitControls / PeerJS (P2P通信ライブラリ) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="game-container"></div>
    <div id="flash-overlay"></div>

    <!-- HUD -->
    <div id="hud">
        <div>1P (YOU): <span id="player-label">BIKE</span></div>
        <div class="hp-bar-bg"><div id="player-hp-fill" class="hp-bar-fill"></div></div>
        <div>2P (ENEMY): <span id="enemy-label">TANK</span></div>
        <div class="hp-bar-bg"><div id="enemy-hp-fill" class="hp-bar-fill"></div></div>
    </div>

    <button id="pause-btn-hud" class="btn btn-secondary" onclick="togglePause()">PAUSE</button>

    <!-- タッチボタン (スマホ対応) -->
    <div id="touch-controls">
        <div class="touch-group">
            <div class="t-btn" id="tb-left">◀</div>
            <div class="t-btn" id="tb-right">▶</div>
        </div>
        <div class="touch-group">
            <div class="t-btn" id="tb-down">▼</div>
            <div class="t-btn" id="tb-up">▲</div>
            <div class="t-btn t-btn-fire" id="tb-fire">🔥</div>
        </div>
    </div>

    <!-- タイトル画面 -->
    <div id="title-screen" class="overlay">
        <h1>Opposition-war</h1>
        <p>3Dバイク VS 戦車 — オンライン対戦 ＆ スマホ対応</p>

        <div class="config-grid">
            <div class="config-box">
                <h4>1. 対戦モード</h4>
                <select id="sel-mode" onchange="toggleOnlineUI()">
                    <option value="offline">1P vs CPU (オフライン)</option>
                    <option value="online">2P オンライン対戦</option>
                </select>

                <div id="online-ui" class="online-panel" style="display: none;">
                    <div>自分のルームID: <b id="my-peer-id" style="color:#00f0ff;">生成中...</b></div>
                    <label>相手のルームIDを入力:</label>
                    <input type="text" id="target-peer-id" placeholder="相手のIDを入力">
                    <button class="btn btn-secondary" style="font-size:0.9rem; padding:6px 15px; margin-top:8px;" onclick="connectToPeer()">接続してプレイ</button>
                    <div id="online-status" style="font-size:0.8rem; color:#00ff88; margin-top:5px;"></div>
                </div>
            </div>

            <div class="config-box">
                <h4>2. マシン選択</h4>
                <label>操作タイプ</label>
                <select id="sel-player-type">
                    <option value="bike">バイク (高速・連射)</option>
                    <option value="tank">戦車 (高耐久・強力砲撃)</option>
                </select>
                <label>ステージ</label>
                <select id="sel-stage">
                    <option value="cyber">サイバーアリーナ</option>
                    <option value="mars">火星ベース</option>
                </select>
            </div>
        </div>

        <button class="btn" onclick="startGame()">GAME START</button>
    </div>

    <!-- ポーズ画面 -->
    <div id="pause-screen" class="overlay" style="display: none;">
        <h1>PAUSED</h1>
        <div style="width:250px; text-align:left;">
            <label>BGM 音量: <span id="bgm-val">50%</span></label>
            <input type="range" id="slider-bgm" min="0" max="100" value="50" oninput="updateAudioSettings()">
            <label>効果音 音量: <span id="sfx-val">70%</span></label>
            <input type="range" id="slider-sfx" min="0" max="100" value="70" oninput="updateAudioSettings()">
        </div>
        <div style="margin-top:20px;">
            <button class="btn btn-secondary" onclick="togglePause()">再開</button>
            <button class="btn" onclick="returnToTitle()">タイトルへ戻る</button>
        </div>
    </div>

    <!-- リザルト画面 -->
    <div id="gameover-screen" class="overlay" style="display: none;">
        <h1 id="gameover-title">VICTORY</h1>
        <p id="gameover-msg">ミッション完了！</p>
        <button class="btn" onclick="restartGame()">RETRY</button>
        <button class="btn btn-secondary" onclick="returnToTitle()">TITLE</button>
    </div>

    <script>
        // WEB AUDIO SYNTH
        let audioCtx = null, bgmGain = null, sfxGain = null, bgmInterval = null;
        function initAudio() {
            if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            bgmGain = audioCtx.createGain(); sfxGain = audioCtx.createGain();
            bgmGain.connect(audioCtx.destination); sfxGain.connect(audioCtx.destination);
            updateAudioSettings(); startBGM();
        }
        function updateAudioSettings() {
            const bgmVal = document.getElementById('slider-bgm').value;
            const sfxVal = document.getElementById('slider-sfx').value;
            document.getElementById('bgm-val').innerText = bgmVal + '%';
            document.getElementById('sfx-val').innerText = sfxVal + '%';
            if (bgmGain) bgmGain.gain.value = (bgmVal / 100) * 0.2;
            if (sfxGain) sfxGain.gain.value = (sfxVal / 100) * 0.4;
        }
        function playSound(type) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            if (type === 'shoot') {
                const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(280, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.connect(gain); gain.connect(sfxGain); osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'hit') {
                const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                osc.type = 'square'; osc.frequency.setValueAtTime(100, now);
                gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.connect(gain); gain.connect(sfxGain); osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'win') {
                [261, 329, 392, 523].forEach((f, i) => {
                    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                    osc.frequency.setValueAtTime(f, now + i*0.1); gain.gain.setValueAtTime(0.3, now + i*0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i*0.1 + 0.25);
                    osc.connect(gain); gain.connect(sfxGain); osc.start(now + i*0.1); osc.stop(now + i*0.1 + 0.25);
                });
            }
        }
        function startBGM() {
            if (bgmInterval) clearInterval(bgmInterval);
            let step = 0; const notes = [110, 110, 130, 146];
            bgmInterval = setInterval(() => {
                if (!audioCtx || !isGameRunning || isPaused) return;
                const now = audioCtx.currentTime, osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(notes[step % 4], now);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.connect(gain); gain.connect(bgmGain); osc.start(now); osc.stop(now + 0.15); step++;
            }, 200);
        }

        // PEERJS (ONLINE)
        let peer = null, peerConn = null, isHost = false, isOnline = false;
        function initPeer() {
            const randomId = Math.floor(100000 + Math.random() * 900000).toString();
            peer = new Peer(randomId);
            peer.on('open', id => { document.getElementById('my-peer-id').innerText = id; });
            peer.on('connection', conn => {
                peerConn = conn; isHost = true; setupPeerEvents();
                document.getElementById('online-status').innerText = "対戦相手が接続しました！";
            });
        }
        function connectToPeer() {
            const targetId = document.getElementById('target-peer-id').value;
            if (!targetId) return alert("相手のルームIDを入力してください");
            peerConn = peer.connect(targetId); isHost = false; setupPeerEvents();
            document.getElementById('online-status').innerText = "接続中...";
        }
        function setupPeerEvents() {
            peerConn.on('open', () => {
                isOnline = true;
                document.getElementById('online-status').innerText = "接続完了！ゲームを開始できます";
            });
            peerConn.on('data', data => handleNetworkData(data));
        }
        function sendNetworkData(data) { if (isOnline && peerConn && peerConn.open) peerConn.send(data); }

        // THREE.JS GAME ENGINE
        let scene, camera, renderer, controls;
        let player, enemy, bullets = [], enemyBullets = [];
        let keys = {};
        let isGameRunning = false, isPaused = false;
        let playerStats = { hp: 100, maxHp: 100, speed: 0, maxSpeed: 0.7, accel: 0.025, rotSpeed: 0.04 }, enemyStats = { hp: 100, maxHp: 100 };

        function toggleOnlineUI() {
            const mode = document.getElementById('sel-mode').value;
            document.getElementById('online-ui').style.display = (mode === 'online') ? 'block' : 'none';
        }

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('game-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.maxPolarAngle = Math.PI / 2 - 0.02;

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const light = new THREE.DirectionalLight(0xffffff, 0.8); light.position.set(30, 60, 30); scene.add(light);

            // スマホ判定＆タッチ操作バインド
            if ('ontouchend' in window || navigator.maxTouchPoints > 0) {
                document.getElementById('touch-controls').style.display = 'flex';
                bindTouch('tb-left', 'KeyA'); bindTouch('tb-right', 'KeyD');
                bindTouch('tb-up', 'KeyW'); bindTouch('tb-down', 'KeyS');
                bindTouch('tb-fire', 'Space');
            }

            window.addEventListener('keydown', e => { keys[e.code] = true; if(e.code==='KeyP') togglePause(); });
            window.addEventListener('keyup', e => keys[e.code] = false);
            window.addEventListener('resize', onWindowResize);

            initPeer(); animate();
        }

        function bindTouch(id, code) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[code] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[code] = false; });
        }

        function buildVehicleMesh(type, color) {
            const group = new THREE.Group(), mat = new THREE.MeshStandardMaterial({ color: color });
            if (type === 'bike') {
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 2.0), mat); body.position.y = 0.5; group.add(body);
                const wGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3);
                const w1 = new THREE.Mesh(wGeo, mat); w1.rotation.z = Math.PI/2; w1.position.set(0, 0.4, 0.9); group.add(w1);
                const w2 = w1.clone(); w2.position.set(0, 0.4, -0.9); group.add(w2);
            } else {
                const body = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.1, 4.2), mat); body.position.y = 0.8; group.add(body);
                const turret = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.8, 2.0), mat); turret.position.set(0, 1.6, 0); group.add(turret);
                const cannon = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 2.8), mat); cannon.rotation.x = Math.PI/2; cannon.position.set(0, 1.6, 1.6); group.add(cannon);
            }
            return group;
        }

        function setupScene() {
            while(scene.children.length > 0) scene.remove(scene.children[0]);
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const light = new THREE.DirectionalLight(0xffffff, 0.8); light.position.set(30, 60, 30); scene.add(light);

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), new THREE.MeshStandardMaterial({ color: 0x0a0a15 }));
            floor.rotation.x = -Math.PI / 2; scene.add(floor);
            const grid = new THREE.GridHelper(240, 48, 0x00f0ff, 0x112244); grid.position.y = 0.01; scene.add(grid);

            const pType = document.getElementById('sel-player-type').value;
            const eType = pType === 'bike' ? 'tank' : 'bike';

            player = buildVehicleMesh(pType, 0x00f0ff);
            enemy = buildVehicleMesh(eType, 0xff0055);

            player.position.set(0, 0, 40);
            enemy.position.set(0, 0, -40);
            scene.add(player); scene.add(enemy);

            playerStats = { hp: 100, maxHp: 100, speed: 0, maxSpeed: pType==='bike'?0.75:0.4, accel: 0.02, rotSpeed: 0.04 };
            enemyStats = { hp: 100, maxHp: 100 };
            bullets = []; enemyBullets = [];

            camera.position.set(0, 10, 60); controls.target.copy(player.position);
            updateHUD();
        }

        function startGame() {
            initAudio();
            document.getElementById('title-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('pause-btn-hud').style.display = 'block';
            setupScene(); isGameRunning = true; isPaused = false;
        }

        function togglePause() {
            if (!isGameRunning) return;
            isPaused = !isPaused;
            document.getElementById('pause-screen').style.display = isPaused ? 'flex' : 'none';
        }

        function returnToTitle() {
            isGameRunning = false; isPaused = false;
            document.getElementById('pause-screen').style.display = 'none';
            document.getElementById('gameover-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'none';
            document.getElementById('pause-btn-hud').style.display = 'none';
            document.getElementById('title-screen').style.display = 'flex';
        }

        function restartGame() {
            document.getElementById('gameover-screen').style.display = 'none';
            setupScene(); isGameRunning = true; isPaused = false;
        }

        function updateHUD() {
            document.getElementById('player-hp-fill').style.width = Math.max(0, (playerStats.hp / playerStats.maxHp)*100) + '%';
            document.getElementById('enemy-hp-fill').style.width = Math.max(0, (enemyStats.hp / enemyStats.maxHp)*100) + '%';
        }

        function shootBullet(isPlayer) {
            playSound('shoot');
            const geo = new THREE.SphereGeometry(0.3, 8, 8);
            const mat = new THREE.MeshBasicMaterial({ color: isPlayer ? 0x00f0ff : 0xff0055 });
            const mesh = new THREE.Mesh(geo, mat);
            const src = isPlayer ? player : enemy;

            mesh.position.copy(src.position); mesh.position.y += 0.8;
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(src.quaternion);
            
            if(isPlayer) bullets.push({ mesh, dir, life: 100 });
            else enemyBullets.push({ mesh, dir, life: 100 });
            scene.add(mesh);

            if(isPlayer && isOnline) sendNetworkData({ type: 'shoot' });
        }

        function updatePlayer() {
            if (keys['KeyW']) playerStats.speed = Math.min(playerStats.speed + playerStats.accel, playerStats.maxSpeed);
            else if (keys['KeyS']) playerStats.speed = Math.max(playerStats.speed - playerStats.accel, -playerStats.maxSpeed / 2);
            else playerStats.speed *= 0.94;

            if (keys['KeyA']) player.rotation.y += playerStats.rotSpeed;
            if (keys['KeyD']) player.rotation.y -= playerStats.rotSpeed;

            player.translateZ(-playerStats.speed);

            if (keys['Space']) {
                if (!player.lastShoot || Date.now() - player.lastShoot > 200) {
                    shootBullet(true); player.lastShoot = Date.now();
                }
            }

            const camOffset = camera.position.clone().sub(controls.target);
            controls.target.copy(player.position); camera.position.copy(player.position).add(camOffset);
            controls.update();

            // 位置情報の通信（2P対戦）
            if (isOnline) {
                sendNetworkData({
                    type: 'transform',
                    x: player.position.x, z: player.position.z, rot: player.rotation.y, hp: playerStats.hp
                });
            }
        }

        function updateEnemyCPU() {
            enemy.lookAt(player.position.x, enemy.position.y, player.position.z);
            if (enemy.position.distanceTo(player.position) > 18) enemy.translateZ(0.12);
            if (!enemy.lastShoot || Date.now() - enemy.lastShoot > 1500) {
                shootBullet(false); enemy.lastShoot = Date.now();
            }
        }

        function handleNetworkData(data) {
            if (data.type === 'transform') {
                enemy.position.x = data.x; enemy.position.z = data.z; enemy.rotation.y = data.rot;
                enemyStats.hp = data.hp; updateHUD();
            } else if (data.type === 'shoot') {
                shootBullet(false);
            }
        }

        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i]; b.mesh.position.addScaledVector(b.dir, 1.3); b.life--;
                if (b.mesh.position.distanceTo(enemy.position) < 2.2) {
                    enemyStats.hp -= 10; playSound('hit'); scene.remove(b.mesh); bullets.splice(i, 1);
                    updateHUD(); checkWinLoss(); continue;
                }
                if (b.life <= 0) { scene.remove(b.mesh); bullets.splice(i, 1); }
            }

            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                let b = enemyBullets[i]; b.mesh.position.addScaledVector(b.dir, 1.3); b.life--;
                if (b.mesh.position.distanceTo(player.position) < 2.2) {
                    playerStats.hp -= 10; playSound('hit'); scene.remove(b.mesh); enemyBullets.splice(i, 1);
                    updateHUD(); checkWinLoss(); continue;
                }
                if (b.life <= 0) { scene.remove(b.mesh); enemyBullets.splice(i, 1); }
            }
        }

        function checkWinLoss() {
            if (enemyStats.hp <= 0) endGame("VICTORY!", "相手を撃破しました！");
            else if (playerStats.hp <= 0) endGame("GAME OVER", "破壊されました...");
        }

        function endGame(title, msg) {
            isGameRunning = false;
            document.getElementById('gameover-title').innerText = title;
            document.getElementById('gameover-msg').innerText = msg;
            document.getElementById('gameover-screen').style.display = 'flex';
            if (title === "VICTORY!") playSound('win');
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isGameRunning && !isPaused) {
                updatePlayer();
                if (!isOnline) updateEnemyCPU();
                updateBullets();
            }
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
